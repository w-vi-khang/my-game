# Điều kiện RIÊNG của project này (ngoài điều kiện chung của kit). Thêm một dòng cho mỗi công cụ project cần.
# Kiểm tra đầy đủ lần đầu / khi file này đổi / sau khi cập nhật kit; kiểm tra nhanh mỗi lần hook chạy.
# Thiếu điều kiện required -> chặn prompt và báo cách cài. optional -> chỉ cảnh báo. Xem kết quả: /ai-workflow-kit:doctor
#
# Cột, ngăn bằng | (không dùng | trong nội dung):
#   tên | lệnh thử lần lượt (ngăn bằng ,) | tham số in version | version tối thiểu | required/optional | dùng cho | cách cài
#
# Ví dụ (bỏ dấu # để dùng):
# node   | node            | --version | 20.0 | required | chạy test/build      | https://nodejs.org hoặc: brew install node
# pnpm   | pnpm            | --version | 9.0  | required | cài dependency       | corepack enable
# pandoc | pandoc          | --version | 3.0  | optional | xuất tài liệu ra PDF | brew install pandoc · winget install JohnMacFarlane.Pandoc

# --- Điều kiện của project my-game ---
git-lfs | git-lfs | version | 3.0 | required | lưu ảnh, model, âm thanh (Git LFS) | macOS: brew install git-lfs · Windows: đi kèm Git for Windows · rồi chạy: git lfs install
unity | /Applications/Unity/Hub/Editor/6000.4.8f1/Unity.app/Contents/MacOS/Unity | -version | 6000.4 | required | test client (verify client_test) | Unity Hub → Installs → 6000.4.8f1 (thêm module Android/iOS khi build)
